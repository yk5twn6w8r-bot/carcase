<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAR CASE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px 12px 60px;background:#070910;color:#e7ecf5;font-family:'Segoe UI',system-ui,sans-serif;position:relative}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 600px at 50% -10%,#1b2440 0%,#0a0d14 60%,#070910 100%)}
.bg::before{content:'';position:absolute;inset:0;background:radial-gradient(800px 500px at 12% 15%,rgba(168,85,247,.2),transparent 60%),radial-gradient(700px 480px at 88% 12%,rgba(240,180,41,.16),transparent 60%),radial-gradient(900px 620px at 50% 105%,rgba(59,130,246,.18),transparent 60%)}
.wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:3px;font-weight:800;background:linear-gradient(90deg,#f0b429,#ff6b35,#f0b429);-webkit-background-clip:text;background-clip:text;color:transparent}
.bal{background:rgba(240,180,41,.1);border:1px solid rgba(240,180,41,.35);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:#f0b429}
.rst{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,80,80,.35);background:rgba(255,80,80,.08);color:#ff7a7a;cursor:pointer;font-size:11px;font-weight:700}
.panel{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px;margin-bottom:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab{padding:10px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;font-weight:800;font-size:13px;color:#8b95a7;letter-spacing:1px;text-transform:uppercase}
.tab.active{color:#141a26;background:linear-gradient(135deg,#f0b429,#ff8a3d);border-color:transparent}
.ptabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
.ptab{padding:8px 4px;border-radius:9px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;font-weight:800;font-size:10px;color:#8b95a7;text-transform:uppercase;text-align:center;font-family:inherit}
.ptab.active{color:#141a26;background:linear-gradient(135deg,#f0b429,#ff8a3d);border-color:transparent}
.ptab:disabled{opacity:.4;cursor:not-allowed}
.ptab .p{display:block;font-size:9px;margin-top:2px;font-weight:700;color:#34d399}
.ptab.active .p{color:#141a26}
.reel-win{position:relative;height:180px;border-radius:14px;overflow:hidden;background:#0e131d;border:2px solid rgba(255,255,255,.07)}
.reel-win::before,.reel-win::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:3;pointer-events:none}
.reel-win::before{left:0;background:linear-gradient(90deg,#0e131d,transparent)}
.reel-win::after{right:0;background:linear-gradient(270deg,#0e131d,transparent)}
.marker{position:absolute;inset:0;pointer-events:none;z-index:4}
.marker i{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,#f0b429,rgba(240,180,41,.05));box-shadow:0 0 18px rgba(240,180,41,.85)}
.marker b{position:absolute;left:50%;top:0;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #f0b429}
.reel{display:flex;gap:8px;will-change:transform;padding:16px 0}
.ri{flex:0 0 120px;height:140px;border-radius:12px;padding:8px 6px;background:linear-gradient(#1a2130,#141a26);border:2px solid var(--rc);display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;box-shadow:inset 0 0 22px -12px var(--rc)}
.ri img{width:100%;height:58px;object-fit:cover;border-radius:6px}
.ri .nm{font-size:10px;line-height:1.2;text-align:center;color:#c8d2e2;height:24px;overflow:hidden;font-weight:600}
.ri .pr{font-size:11px;font-weight:800;color:#f0b429}
.ri .tg{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--rc);font-weight:800}
.rc{--rc:#8b95a7}.rr{--rc:#3b82f6}.re{--rc:#a855f7}.rl{--rc:#f59e0b}
.spin{width:100%;margin-top:12px;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:800;letter-spacing:1px;cursor:pointer;color:#141a26;background:linear-gradient(135deg,#f0b429,#ff8a3d)}
.spin:disabled{opacity:.5;cursor:not-allowed}
.pv{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 8px;border-radius:5px;font-family:monospace;font-weight:900;letter-spacing:1px;border:2px solid;font-size:12px;min-height:32px;line-height:1}
.pc{background:#f5f5f5;color:#111;border-color:#bbb}
.pr2{background:#1e40af;color:#fff;border-color:#3b82f6}
.pe{background:#6d28d9;color:#fff;border-color:#a855f7}
.pl{background:#f59e0b;color:#111;border-color:#fbbf24}
.pcb{background:linear-gradient(135deg,#ff2d55,#f59e0b,#a855f7);color:#fff;border-color:#fff}
.pv .rg{font-size:9px;padding:2px 3px;border-left:1px solid currentColor;opacity:.85}
.daily{width:100%;margin-bottom:14px;padding:14px;border-radius:14px;border:2px solid rgba(52,211,153,.5);cursor:pointer;background:linear-gradient(135deg,rgba(52,211,153,.15),rgba(16,185,129,.08));color:#34d399;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;font-family:inherit}
.daily:disabled{cursor:not-allowed;opacity:.6;color:#8b95a7;border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.03)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sc{padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);text-align:center}
.sc .l{font-size:9px;color:#8b95a7;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.sc .v{font-size:15px;font-weight:900;color:#f0b429}
.st{font-size:10px;color:#8b95a7;letter-spacing:1px;text-transform:uppercase;font-weight:800;margin:10px 0 8px}
.top-l{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ti{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.35);border:1.5px solid var(--rc)}
.ti .rk{flex:0 0 30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:linear-gradient(135deg,var(--rc),rgba(0,0,0,.4));color:#fff;border:2px solid var(--rc)}
.ti.r1 .rk{background:linear-gradient(135deg,#f0b429,#8a6d00);border-color:#fbbf24}
.ti .tv{flex:0 0 58px;height:42px;overflow:hidden}
.ti .tv img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.ti .ti-n{flex:1;min-width:0;font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .ti-p{font-size:13px;font-weight:900;color:#f0b429;white-space:nowrap}
.hist{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px}
.hi{flex:0 0 auto;padding:5px 9px;border-radius:7px;font-size:10px;font-weight:700;border:1.5px solid var(--rc);background:rgba(0,0,0,.35);color:var(--rc);white-space:nowrap}
.ach-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.ach-h h2{margin:0;font-size:15px;letter-spacing:1px;font-weight:700}
.ach-h-r{display:flex;gap:8px;align-items:center}
.ach-h .pg{font-size:12px;color:#8b95a7}
.ach-h .pg b{color:#f0b429}
.at{width:34px;height:34px;border-radius:10px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#c8d2e2;cursor:pointer;display:flex;align-items:center;justify-content:center}
.at svg{width:16px;height:16px;transition:transform .3s}
.at.collapsed svg{transform:rotate(-90deg)}
.ach-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:5000px;overflow:hidden;transition:max-height .4s,opacity .3s,margin .3s;opacity:1}
.ach-g.collapsed{max-height:0;opacity:0;margin-top:-8px}
.ac{padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08)}
.ac.u{background:linear-gradient(135deg,rgba(240,180,41,.12),rgba(255,138,61,.06));border-color:rgba(240,180,41,.5)}
.ac .r{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ac .ic{flex:0 0 32px;height:32px;border-radius:9px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:16px;border:1.5px solid rgba(255,255,255,.1)}
.ac.u .ic{background:linear-gradient(135deg,#f0b429,#ff8a3d);border-color:#fbbf24}
.ac .nm{flex:1;font-size:12px;font-weight:800;color:#e7ecf5}
.ac.l .nm{color:#8b95a7}
.ac .d{font-size:10px;color:#8b95a7;line-height:1.35;margin-bottom:6px}
.ac .b{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:5px}
.ac .bf{height:100%;background:linear-gradient(90deg,#a855f7,#f0b429)}
.ac.u .bf{background:linear-gradient(90deg,#f0b429,#ff8a3d)}
.ac .f{display:flex;justify-content:space-between;font-size:10px;font-weight:800}
.ac .f .pr{color:#8b95a7}
.ac .f .rw{color:#34d399}
.ac.u .f .pr{color:#34d399}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.sh-h h2{margin:0;font-size:15px;letter-spacing:1px;font-weight:700}
.sh-t{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#e7ecf5;padding:7px 12px;border-radius:10px;cursor:pointer;font-size:11px;font-weight:700}
.sh-f{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.sf{padding:6px 10px;border-radius:7px;border:1.5px solid var(--rc,rgba(255,255,255,.15));background:rgba(255,255,255,.03);color:var(--rc,#8b95a7);cursor:pointer;font-size:10px;font-weight:800;text-transform:uppercase}
.sf.active{background:var(--rc,#f0b429);color:#141a26}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:0;overflow:hidden;transition:max-height .4s}
.sg.open{max-height:6000px}
.ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.ih h2{margin:0;font-size:15px;letter-spacing:1px;font-weight:700}
.ihr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sortg{display:flex;gap:2px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:2px}
.sb{padding:5px 8px;border-radius:6px;border:none;background:transparent;color:#8b95a7;cursor:pointer;font-size:10px;font-weight:800;font-family:inherit}
.sb.active{background:linear-gradient(135deg,#f0b429,#ff8a3d);color:#141a26}
.sla{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#e7ecf5;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:11px;font-weight:600}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ic2,.sc2{position:relative;background:linear-gradient(#1a2130,#141a26);border:2px solid var(--rc);border-radius:12px;padding:8px 6px;text-align:center}
.ic2 img,.sc2 img{width:100%;height:62px;object-fit:cover;border-radius:7px;display:block}
.ic2 .nm,.sc2 .nm{font-size:10px;font-weight:700;color:#c8d2e2;margin:5px 0 2px;line-height:1.25}
.ic2 .tg,.sc2 .tg{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--rc);font-weight:800}
.ic2 .b{display:flex;gap:3px;margin-top:6px}
.ic2 .b button{flex:1;padding:6px 3px;border-radius:7px;border:none;cursor:pointer;font-weight:800;font-size:10px}
.ic2 .s{background:rgba(240,180,41,.15);color:#f0b429}
.ic2 .u{background:rgba(168,85,247,.15);color:#c084fc}
.ic2 .a{background:rgba(59,130,246,.15);color:#60a5fa}
.ic2 .pb{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.1);display:flex;align-items:center;gap:4px;justify-content:center}
.ic2 .pb .pv{font-size:9px;padding:3px 5px;min-height:auto}
.ic2 .pb .rmv{background:rgba(255,80,80,.85);border:none;color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.sc2 .buy{width:100%;margin-top:6px;padding:7px;border:none;border-radius:7px;cursor:pointer;background:rgba(52,211,153,.15);color:#34d399;font-weight:800;font-size:11px}
.sc2 .buy:disabled{opacity:.35;cursor:not-allowed;background:rgba(255,255,255,.05);color:#8b95a7}
.empty{color:#5b6577;text-align:center;padding:30px;font-size:13px;grid-column:1/-1}
.upg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.upg-h h2{margin:0;font-size:15px;letter-spacing:1px;font-weight:700}
.upg-h .hint{color:#8b95a7;font-size:11px}
.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.us{aspect-ratio:1/1.15;border:2px dashed rgba(255,255,255,.15);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;position:relative;background:rgba(0,0,0,.25)}
.us.f{border-style:solid;border-color:var(--rc);background:linear-gradient(#1a2130,#141a26)}
.us img{width:100%;height:46px;object-fit:cover;border-radius:5px}
.us .nm{font-size:9px;text-align:center;margin-top:4px;color:#c8d2e2;font-weight:600;line-height:1.15}
.us .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(255,80,80,.9);border:none;color:#fff;cursor:pointer;font-weight:800;font-size:12px}
.us .et{color:#5b6577;font-size:10px;text-align:center}
.ur{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ur>.lbl{font-size:11px;color:#8b95a7;font-weight:700;text-transform:uppercase}
.ut{padding:7px 11px;border-radius:9px;border:2px solid var(--rc);background:rgba(255,255,255,.04);cursor:pointer;color:var(--rc);font-weight:800;font-size:11px;text-transform:uppercase;font-family:inherit}
.ut.active{background:var(--rc);color:#141a26}
.ut:disabled{opacity:.25;cursor:not-allowed}
.ui{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:11px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3);margin-bottom:10px}
.ui .l{font-size:11px;color:#b8a4d8;text-transform:uppercase;font-weight:700}
.ui .v{font-size:20px;font-weight:900;color:#34d399}
.ub{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:800;letter-spacing:1px;cursor:pointer;color:#141a26;background:linear-gradient(135deg,#a855f7,#f0b429);font-family:inherit}
.ub:disabled{opacity:.4;cursor:not-allowed}
.ovl{position:fixed;inset:0;background:rgba(4,6,12,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.ovl.on{display:flex}
.wc,.um,.am{width:100%;max-width:340px;text-align:center;padding:22px 18px;border-radius:20px;background:linear-gradient(#1c2434,#121824);border:2px solid var(--rc,rgba(255,255,255,.12));box-shadow:0 0 60px -10px var(--rc,rgba(168,85,247,.5))}
.wc img{width:100%;max-width:260px;height:130px;object-fit:cover;border-radius:11px;display:block;margin:8px auto}
.wc .pv{margin:12px auto;font-size:18px;padding:10px 16px}
.wc .nm{font-size:16px;font-weight:800;margin:8px 0 4px}
.wc .tg,.um .tg{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--rc,#a855f7);font-weight:800}
.wc .pr3{font-size:20px;font-weight:800;color:#f0b429;margin:10px 0 14px}
.wc button,.um button{width:100%;padding:12px;border-radius:11px;border:none;cursor:pointer;font-weight:800;font-size:14px;background:linear-gradient(135deg,#f0b429,#ff8a3d);color:#141a26;margin-top:12px;font-family:inherit}
.um{max-width:400px}
.ubar{position:relative;height:36px;border-radius:11px;overflow:hidden;margin:16px 0;background:#0a0e16;border:1px solid rgba(255,255,255,.1)}
.uz{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(52,211,153,.7),rgba(52,211,153,.15));border-right:2px solid #34d399}
.up{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;box-shadow:0 0 14px #fff;transition:left 3.4s cubic-bezier(.15,.9,.25,1)}
.up::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#fff}
.ucl{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:900;color:#fff;z-index:2}
.ur2{font-size:14px;font-weight:800;min-height:40px;line-height:1.3;margin-top:6px}
.am{max-width:480px;max-height:80vh;overflow-y:auto}
.am h3{margin:0 0 12px;font-size:15px;text-transform:uppercase;color:#60a5fa;font-weight:800;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.al{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:6px}
.ac2{background:linear-gradient(#1a2130,#141a26);border:2px solid var(--rc);border-radius:9px;padding:6px;cursor:pointer}
.ac2 img{width:100%;height:46px;object-fit:cover;border-radius:5px}
.ac2 .nm{font-size:9px;font-weight:700;color:#c8d2e2;margin-top:4px}
.ac2 .pv{font-size:9px;padding:3px 5px;min-height:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#1c2434;border:1px solid rgba(255,255,255,.14);padding:10px 18px;border-radius:11px;font-size:13px;font-weight:600;pointer-events:none;transition:.28s;z-index:200}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sv{position:fixed;bottom:20px;right:20px;padding:6px 12px;border-radius:9px;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.4);color:#34d399;font-size:11px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:250}
.sv.on{opacity:1}
.an{position:fixed;top:16px;right:16px;max-width:320px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#1c2434,#121824);border:2px solid #f0b429;box-shadow:0 0 40px -6px rgba(240,180,41,.9);z-index:300;display:none;align-items:center;gap:10px}
.an.on{display:flex}
.an .ai{flex:0 0 38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#f0b429,#ff8a3d);display:flex;align-items:center;justify-content:center;font-size:20px}
.an .albl{font-size:9px;color:#f0b429;text-transform:uppercase;font-weight:900}
.an .anm{font-size:13px;font-weight:800;color:#fff;margin-top:2px}
.an .ar{font-size:11px;color:#34d399;font-weight:800}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.al{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<header>
<h1>CAR CASE</h1>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<div class="bal">💰 <span id="bal">0</span> ₵</div>
<button class="rst" id="rst">СБРОС</button>
</div>
</header>
<div class="panel">
<div class="tabs">
<button class="tab active" data-m="car">🚗 Машины</button>
<button class="tab" data-m="plate">🔢 Номера</button>
</div>
<div class="ptabs" id="ptabs" style="display:none">
<button class="ptab active" data-c="free">Бесплатно<span class="p">0 ₵</span></button>
<button class="ptab" data-c="common">Обычный<span class="p">500 ₵</span></button>
<button class="ptab" data-c="rare">Редкий<span class="p">2000 ₵</span></button>
<button class="ptab" data-c="epic">Эпик<span class="p">8000 ₵</span></button>
<button class="ptab" data-c="legendary">Легенда<span class="p">25000 ₵</span></button>
</div>
<div class="reel-win" id="rw">
<div class="marker"><i></i><b></b></div>
<div class="reel" id="reel"></div>
</div>
<button class="spin" id="spin">🎁 ОТКРЫТЬ — БЕСПЛАТНО</button>
</div>
<div class="panel">
